services:
  postgres:
    image: postgres:17
    container_name: webhook-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: webhook-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: ./api
    container_name: webhook-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./api
    container_name: webhook-worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WORKER_NAME: worker-1
      PYTHONPATH: /app
      # Defaults match production behaviour; override for quick demos, e.g.
      #   set RETRY_DELAYS=1,2,3,4,5
      #   set CIRCUIT_HEALTH_CHECK_INTERVAL=10
      RETRY_DELAYS: ${RETRY_DELAYS:-1,5,30,300,1800}
      CIRCUIT_HEALTH_CHECK_INTERVAL: ${CIRCUIT_HEALTH_CHECK_INTERVAL:-60}
    volumes:
      - ./api:/app
      - ./workers:/worker
    command: python -u /worker/worker.py
    depends_on:
      - postgres
      - redis
  
  retry-scheduler:
    build:
      context: ./api
    container_name: webhook-retry-scheduler
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PYTHONPATH: /app
    volumes:
      - ./api:/app
      - ./workers:/worker
    command: python -u /worker/retry_scheduler.py
    depends_on:
      - postgres
      - redis

  demo-subscriber:
    build:
      context: ./demo-subscriber
    container_name: webhook-demo-subscriber
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    ports:
      - "8001:8001"
    volumes:
      - ./demo-subscriber:/app

  # Second receiver with its own secret: the "healthy" subscriber in the
  # kill-and-recover demo (the first one is the one that gets killed).
  demo-subscriber-2:
    build:
      context: ./demo-subscriber
    container_name: webhook-demo-subscriber-2
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET_2:-day5-healthy-secret}
    ports:
      - "8002:8001"
    volumes:
      - ./demo-subscriber:/app

  dashboard:
    build:
      context: ./dashboard
    container_name: webhook-dashboard
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      DEMO_SUBSCRIBER_URL: http://demo-subscriber:8001
volumes:
  postgres_data: