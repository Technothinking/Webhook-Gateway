services:
  postgres:
    image: postgres:17
    container_name: webhook-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: webhook-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: ./api
    container_name: webhook-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./api
    container_name: webhook-worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WORKER_NAME: worker-1
      PYTHONPATH: /app
    volumes:
      - ./api:/app
      - ./workers:/worker
    command: python -u /worker/worker.py
    depends_on:
      - postgres
      - redis
  
  retry-scheduler:
    build:
      context: ./api
    container_name: webhook-retry-scheduler
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PYTHONPATH: /app
    volumes:
      - ./api:/app
      - ./workers:/worker
    command: python -u /worker/retry_scheduler.py
    depends_on:
      - postgres
      - redis

  demo-subscriber:
    build:
      context: ./demo-subscriber
    container_name: webhook-demo-subscriber
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    ports:
      - "8001:8001"
    volumes:
      - ./demo-subscriber:/app

  dashboard:
    build:
      context: ./dashboard
    container_name: webhook-dashboard
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  postgres_data: