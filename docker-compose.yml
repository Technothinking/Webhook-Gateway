services:
  postgres:
    image: postgres:17
    container_name: webhook-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: webhook-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: ./api
    container_name: webhook-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    depends_on:
      - postgres
      - redis

  dashboard:
    build:
      context: ./dashboard
    container_name: webhook-dashboard
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  postgres_data: